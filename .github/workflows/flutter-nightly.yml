name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      lite:
        description: "精简被控版（仅被控，锁定设置）"
        type: boolean
        default: false
      selfsign:
        description: "用自签名证书给 Windows 产物签名"
        type: boolean
        default: true
      preset_server:
        description: "首启默认服务器：留空=bbs(阿里云)，ak=NAS(ak.ahwt.xyz)，cc=阿里云(rustdesk.ahwt.cc)"
        type: string
        default: ""

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      lite: ${{ inputs.lite == true }}
      selfsign: ${{ inputs.selfsign != false }}
      preset_server: ${{ inputs.preset_server || '' }}
